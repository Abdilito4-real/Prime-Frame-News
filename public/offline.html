<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | PrimeFrame</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; min-height: 100vh; display: grid; place-items: center; }
      .card { max-width: 480px; background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08); }
      h1 { margin-top: 0; }
      p { color: #475569; line-height: 1.6; }
      a { color: #0f172a; text-decoration: underline; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You’re offline</h1>
      <p>PrimeFrame has cached the latest edition for reading without a connection. Please reconnect to receive the latest updates.</p>
      <p><a href="/">Return to homepage</a></p>
    </main>
  </body>
</html>
